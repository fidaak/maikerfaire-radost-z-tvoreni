# /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
#
# WAN WiFi client: connects wlan0 (MT7925B internal) to venue WiFi.
# Managed by wpa_supplicant@wlan0.service + systemd-networkd.
#
# To add a new network entry from the command line:
#   wpa_passphrase "VENUE_SSID" "passphrase" >> /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
#
# To update live without restarting:
#   wpa_cli -i wlan0 reconfigure

ctrl_interface=/run/wpa_supplicant
ctrl_interface_group=wheel
update_config=1

# --- Venue network (primary — used at MakerFaire) ---
network={
    ssid="VENUE_SSID_HERE"
    psk="VENUE_PASSPHRASE_HERE"
    # Alternatively use the hashed PSK (more secure, no plaintext password):
    # psk=<hash from wpa_passphrase>
    key_mgmt=WPA-PSK
    priority=10
}

# --- Fallback: open network (captive portal venues) ---
# Uncomment if needed:
# network={
#     ssid="OPEN_NETWORK_SSID"
#     key_mgmt=NONE
#     priority=1
# }
