# /etc/systemd/resolved.conf.d/no-stub.conf
#
# Disable systemd-resolved's stub DNS listener on 127.0.0.53:53.
# This frees port 53 for dnsmasq to bind on all interfaces.
#
# Install:
#   mkdir -p /etc/systemd/resolved.conf.d/
#   cp resolved-no-stub.conf /etc/systemd/resolved.conf.d/no-stub.conf
#   systemctl restart systemd-resolved
#
# After disabling the stub, /etc/resolv.conf must point to the correct
# nameserver. The full-feature resolved socket still works at
# /run/systemd/resolve/io.systemd.Resolve but not on port 53.
#
# On Debian/Ubuntu, /etc/resolv.conf is a symlink. After this change,
# re-link it:
#   ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
# This makes the router itself use systemd-resolved (which forwards to
# 1.1.1.1 etc.) for its own DNS, while dnsmasq handles LAN clients.

[Resolve]
DNSStubListener=no
