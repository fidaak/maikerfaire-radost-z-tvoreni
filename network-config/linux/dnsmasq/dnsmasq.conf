# /etc/dnsmasq.conf
#
# DHCP server + DNS forwarder for br-lan (192.168.100.0/24).
#
# ---- systemd-resolved conflict ----
# By default, systemd-resolved listens on 127.0.0.53:53 (stub resolver).
# dnsmasq also wants port 53 → port conflict → dnsmasq fails to start.
#
# Resolution: disable systemd-resolved's stub listener.
# Create /etc/systemd/resolved.conf.d/no-stub.conf with:
#
#   [Resolve]
#   DNSStubListener=no
#
# Then: systemctl restart systemd-resolved
# Then: rm /etc/resolv.conf && ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
# (This makes the system use systemd-resolved's non-stub DNS, not port 53)
#
# dnsmasq handles DNS for LAN clients only. The router itself uses
# systemd-resolved (which forwards upstream) for its own name resolution.

# ---- Interface binding ----
# Only listen on br-lan — never on wlan0 (WAN)
interface=br-lan
# Explicitly do not listen on wlan0 (belt-and-suspenders)
except-interface=wlan0
# Bind only to the interfaces above (not to 0.0.0.0)
bind-interfaces

# ---- DNS ----
# Do not forward plain hostnames (no dots) to upstream — they are LAN-local
domain-needed
# Do not forward requests for 192.168.x.x reverse DNS to upstream
bogus-priv
# Upstream DNS servers: Cloudflare + Google fallback
# Used only when venue internet is available; when offline dnsmasq returns
# SERVFAIL for external names (clients fall back gracefully)
server=1.1.1.1
server=8.8.8.8
# Optional: add the venue's DNS if you know it (gets populated via wlan0 DHCP)
# server=<venue-dns-ip>

# Cache up to 500 DNS entries
cache-size=500

# Local domain for LAN hosts
domain=makerbooth.local
local=/makerbooth.local/

# ---- DHCP pool ----
# Range: .100 to .199 (100 addresses), 12-hour lease
# .1   = router (this machine)
# .10  = Voron 2.4r2 (static, see below)
# .11  = Voron 0.2 (static, see below)
# .100-.199 = dynamic pool
dhcp-range=192.168.100.100,192.168.100.199,255.255.255.0,12h

# DHCP options pushed to all clients
# Option 3 = default gateway
dhcp-option=3,192.168.100.1
# Option 6 = DNS server (point clients at dnsmasq on the router)
dhcp-option=6,192.168.100.1
# Option 15 = domain name
dhcp-option=15,makerbooth.local

# ---- Static DHCP leases ----
# Format: dhcp-host=MAC,IP,hostname,lease-time
#
# Voron 2.4r2 — wired Ethernet (eth0 or eth1)
# REPLACE with actual MAC from: ip link show (on Voron) or check your router
dhcp-host=aa:bb:cc:dd:ee:01,192.168.100.10,voron24,infinite

# Voron 0.2 — 2.4 GHz WiFi via wlan1 AP
# REPLACE with actual MAC from: ip link show wlan0 (on Voron 0.2 RPi/BTT)
dhcp-host=aa:bb:cc:dd:ee:02,192.168.100.11,voron02,infinite

# ---- DNS A records for static hosts ----
# (dnsmasq auto-creates these from dhcp-host entries when domain= is set,
# but explicit entries override and also work without a DHCP lease)
address=/voron24.makerbooth.local/192.168.100.10
address=/voron02.makerbooth.local/192.168.100.11
address=/router.makerbooth.local/192.168.100.1

# ---- Logging ----
log-queries=no
log-dhcp
# Uncomment for verbose debug:
# log-queries
# log-facility=/var/log/dnsmasq.log

# ---- Misc ----
# Do not read /etc/hosts for DNS (avoid leaking host's local entries to LAN)
no-hosts
# PID file (used by init script)
pid-file=/run/dnsmasq/dnsmasq.pid
# User to run as
user=dnsmasq
group=nogroup
