# /etc/sysctl.d/99-router.conf
#
# Kernel parameters for Linux software router operation.
# Apply immediately: sysctl -p /etc/sysctl.d/99-router.conf
# Applied on boot by systemd-sysctl.service

# ---- IP forwarding (required for routing / NAT) ----
net.ipv4.ip_forward = 1
# Disable IPv6 forwarding (we're IPv4-only for the booth)
net.ipv6.conf.all.forwarding = 0

# ---- Reverse path filtering ----
# rp_filter=1: strict mode — drop packets whose source address is not
# reachable via the interface they arrived on. Prevents spoofing.
# Set to 2 (loose) on WAN if the venue does asymmetric routing; 1 is fine
# for most venues.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.wlan0.rp_filter = 1

# ---- SYN flood protection ----
net.ipv4.tcp_syncookies = 1

# ---- ICMP redirects ----
# Do not send ICMP redirects — we are a router, not a host
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Do not accept ICMP redirects from the venue router
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.wlan0.accept_redirects = 0

# ---- Source routing ----
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# ---- ARP ----
# Ignore ARP requests on interfaces other than the one where the
# target IP is configured (important on multi-homed machines)
net.ipv4.conf.all.arp_ignore = 1
# Reply to ARP for the IP on the interface that received the ARP
net.ipv4.conf.all.arp_announce = 2

# ---- TCP buffer sizes (optional tuning for 10GbE) ----
# Uncomment if transferring large files between printers and mini PC:
# net.core.rmem_max = 16777216
# net.core.wmem_max = 16777216
# net.ipv4.tcp_rmem = 4096 87380 16777216
# net.ipv4.tcp_wmem = 4096 65536 16777216
