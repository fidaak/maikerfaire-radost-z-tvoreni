#!/usr/sbin/nft -f
# /etc/nftables.conf
#
# Firewall for MakerBooth Linux router (MS-S1 MAX)
# WAN: wlan0  (venue WiFi, DHCP, unknown subnet)
# LAN: br-lan (192.168.100.0/24 — eth0, eth1, wlan1 AP bridge)
#
# Policy summary:
#   INPUT:   accept from LAN + loopback; accept established from WAN;
#            drop new/invalid from WAN; rate-limit ICMP from WAN
#   FORWARD: allow LAN→WAN; allow established/related WAN→LAN;
#            drop new WAN→LAN (no port forwarding)
#   OUTPUT:  accept all (router-originated traffic is trusted)
#   NAT:     masquerade LAN→WAN (source NAT with dynamic WAN IP)
#
# Apply: nft -f /etc/nftables.conf
# Check: nft list ruleset
# Enable on boot: systemctl enable --now nftables

flush ruleset

# ---- Variables ----
define WAN_IF  = "wlan0"
define LAN_IF  = "br-lan"
define LAN_NET = 192.168.100.0/24

# ---- Filter table ----
table inet filter {

    # ------------------------------------------------------------------
    # INPUT chain — traffic destined for the router itself
    # ------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        # Accept loopback unconditionally
        iifname "lo" accept

        # Accept established and related connections from anywhere
        # (e.g. DHCP replies from venue router on wlan0, SSH sessions, etc.)
        ct state established,related accept

        # Drop invalid packets early
        ct state invalid drop

        # Accept all traffic from the LAN (we trust our own network)
        iifname $LAN_IF accept

        # ---- WAN (wlan0) — be selective ----

        # ICMP from WAN: allow echo-request (ping) with rate limiting
        # to prevent ping flood; allow other informational ICMP types
        iifname $WAN_IF ip protocol icmp icmp type { echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
        iifname $WAN_IF ip protocol icmp icmp type echo-request limit rate 5/second accept

        # DHCPv4 replies from venue router (src port 67, dst port 68)
        # These arrive before wlan0 has an IP, so ct state won't catch them
        iifname $WAN_IF udp sport 67 udp dport 68 accept

        # Drop everything else from WAN (new connections, unsolicited traffic)
        # log prefix "[nft-drop-input] " flags all  # uncomment to debug
        drop
    }

    # ------------------------------------------------------------------
    # FORWARD chain — traffic being routed through the router
    # ------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Drop invalid packets
        ct state invalid drop

        # Allow established and related flows in both directions
        # (this handles WAN→LAN return traffic for LAN-initiated sessions)
        ct state established,related accept

        # Allow LAN→WAN (new connections from our devices to the internet)
        iifname $LAN_IF oifname $WAN_IF accept

        # LAN→LAN (same bridge, different ports) — allowed implicitly by
        # the bridge, but be explicit here for clarity
        iifname $LAN_IF oifname $LAN_IF accept

        # Drop everything else:
        # - WAN→LAN new connections (unsolicited inbound)
        # - Any other unexpected forward paths
        # log prefix "[nft-drop-fwd] " flags all  # uncomment to debug
        drop
    }

    # ------------------------------------------------------------------
    # OUTPUT chain — traffic originating from the router itself
    # ------------------------------------------------------------------
    chain output {
        type filter hook output priority filter; policy accept;
        # Accept all router-originated traffic.
        # Restrict here if you want to limit what the router can reach.
    }
}

# ---- NAT table ----
table ip nat {

    # ------------------------------------------------------------------
    # POSTROUTING chain — masquerade LAN traffic leaving via WAN
    # ------------------------------------------------------------------
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Masquerade: replace source IP of LAN packets with current
        # wlan0 IP (assigned by venue DHCP). Works even if wlan0 IP
        # changes. If wlan0 has no IP (venue offline), NAT simply doesn't
        # apply and LAN→WAN traffic is dropped by routing (no default route).
        oifname $WAN_IF masquerade
    }

    # ------------------------------------------------------------------
    # PREROUTING chain — placeholder for future DNAT / port forwarding
    # ------------------------------------------------------------------
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        # Example: expose Mainsail (Voron 2.4r2) to venue WiFi visitors:
        # iifname $WAN_IF tcp dport 8080 dnat to 192.168.100.10:80
        # (Leave empty = no port forwarding from WAN)
    }
}
