# /etc/hostapd/hostapd.conf
#
# Access Point for wlan1 (TP-Link Archer T2UH, RTL8812AU chipset)
# Band: 2.4 GHz only — required for Voron 0.2 (2.4 GHz only device)
# Bridge: br-lan — AP clients get IPs from dnsmasq on the bridge
#
# ---- DRIVER NOTE ----
# RTL8812AU (Archer T2UH) Linux driver history:
#   - Kernels < 6.13: requires out-of-tree DKMS driver.
#       Best maintained fork: https://github.com/aircrack-ng/rtl8812au
#       Or morrownr's fork:   https://github.com/morrownr/8812au-20210820
#       Install: git clone; make; make install; modprobe 88XXau
#   - Kernel 6.13-6.13.x: in-tree rtw88 driver added but had kernel
#       panic issues on some hardware — avoid or patch.
#   - Kernel 6.14+: in-tree rtw88 driver is stable. No DKMS needed.
#       Module name: rtw88_8812au (or rtw88_usb + rtw88_8812a)
#
# Verify AP mode is supported:
#   iw list | grep -A 10 "Supported interface modes"
#   (should show "AP" in the list)
#
# With out-of-tree driver, driver=nl80211 still works (not rtl871xdrv).
# The old rtl871xdrv was a Realtek-patched hostapd; modern forks use nl80211.

interface=wlan1
driver=nl80211

# Bridge: hostapd will add wlan1 to br-lan automatically.
# This means AP clients appear on the same L2 segment as eth0/eth1.
bridge=br-lan

# ---- SSID & Security ----
ssid=MakerBoothLAN

# WPA2-PSK (AES/CCMP only — no TKIP)
# Change the passphrase before the event.
wpa=2
wpa_passphrase=MakerFaire2026!
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# Disable WPA1 (TKIP) entirely
wpa_pairwise=CCMP

# ---- WPA3-SAE (optional upgrade) ----
# If the rtw88 / morrownr driver supports SAE (check with: iw list | grep SAE),
# you can enable WPA3 transition mode (accepts both WPA2 and WPA3 clients):
# wpa_key_mgmt=WPA-PSK SAE
# ieee80211w=1           # Management Frame Protection optional (WPA2 clients)
# sae_password=MakerFaire2026!
# sae_require_mfp=0      # don't require MFP for SAE on 2.4 GHz

# ---- 2.4 GHz band settings ----
hw_mode=g
# Channel strategy for crowded 2.4 GHz convention venues:
#   Only channels 1, 6, 11 are non-overlapping in 2.4 GHz.
#   At a venue, scan with: iwlist wlan1 scan | grep Frequency
#   or: iw dev wlan0 scan | grep "freq:"
#   Choose whichever of 1/6/11 has the fewest APs or lowest signal.
#   channel=0 enables ACS (Automatic Channel Selection) — requires
#   driver support; with RTL8812AU it may not work reliably, so
#   prefer manual selection.
channel=6

# HT (802.11n) support on 2.4 GHz
ieee80211n=1

# HT capabilities: use HT20 (20 MHz channel width) at a convention.
# HT40 doubles throughput but uses 40 MHz — in a crowded venue this
# causes more interference and is actively harmful to other APs.
# HT20 is the correct choice here.
# SHORT-GI-20: short guard interval (slightly higher throughput)
ht_capab=[SHORT-GI-20]
# Do NOT add [HT40+] or [HT40-] in a crowded venue.

# Disable 802.11ac (VHT) on 2.4 GHz — VHT is 5 GHz only anyway
ieee80211ac=0

# ---- Country & regulatory ----
country_code=CZ
# Enforce regulatory domain for CZ (required for correct power limits)
ieee80211d=1
# 802.11h: DFS/TPC — only needed on 5 GHz DFS channels; leave enabled
# as it's harmless on 2.4 GHz
ieee80211h=0

# ---- TX power ----
# 0 = use driver/regulatory maximum. Reduce if printers are nearby
# (e.g. 15 dBm) to avoid saturating close-range clients.
# txpower=0

# ---- Management & misc ----
# Beacon interval in TUs (1 TU = 1.024 ms). 100 is standard.
beacon_int=100
# DTIM period: how often multicast/broadcast is buffered for sleeping clients
dtim_period=2
# Maximum number of stations
max_num_sta=10
# RTS/CTS threshold: 2347 = disabled (safe for small networks)
rts_threshold=2347
# Fragmentation threshold: 2346 = disabled
fragm_threshold=2346

# Require WPA (do not allow open association)
auth_algs=1

# Hide SSID? Set to 1 to not broadcast. Keep 0 (visible) for event:
# visitors can connect if they want, and it's easier to debug.
ignore_broadcast_ssid=0

# ---- Logging ----
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
