# systemd drop-in override for hostapd.service
# Install at: /etc/systemd/system/hostapd.service.d/override.conf
# Create directory: mkdir -p /etc/systemd/system/hostapd.service.d/
#
# Purpose:
#   1. Point hostapd at our config file (Debian/Ubuntu default may be empty)
#   2. Ensure hostapd starts AFTER br-lan bridge is configured by networkd
#   3. Restart on failure (important for AP stability over a long event)
#
# On Debian/Ubuntu, also edit /etc/default/hostapd and set:
#   DAEMON_CONF="/etc/hostapd/hostapd.conf"
# This is read by the SysV init script; the systemd unit reads DAEMON_CONF
# from EnvironmentFile=/etc/default/hostapd. The ExecStart override below
# is the reliable method regardless.

[Unit]
Description=Hostapd IEEE 802.11 AP (MakerBooth 2.4 GHz)
# br-lan must exist and have its IP before hostapd tries to bridge wlan1
After=systemd-networkd.service sys-subsystem-net-devices-br\x2dlan.device
Wants=sys-subsystem-net-devices-br\x2dlan.device

[Service]
# Override ExecStart to pass our config explicitly
ExecStart=
ExecStart=/usr/sbin/hostapd -B -P /run/hostapd.pid /etc/hostapd/hostapd.conf

# Restart policy: always restart on failure, with a short delay
Restart=on-failure
RestartSec=5

# If wlan1 (USB dongle) disappears (e.g. unplugged), hostapd exits.
# With Restart=on-failure it will keep retrying until the dongle is back.

[Install]
WantedBy=multi-user.target
