# /etc/wpa_supplicant/wpa_supplicant.conf  — Voron 0.2
# This is the EXISTING home config — no changes needed for booth.
# Voron 0.2 already connects to FMJL-IoT; the booth hotspot uses the same SSID + password.

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=CZ

network={
    ssid="FMJL-IoT"
    psk="<home WiFi password — already configured on printer>"
    key_mgmt=WPA-PSK
    proto=RSN
    pairwise=CCMP
    auth_alg=OPEN
    # Force 2.4 GHz — Voron 0.2 only has 2.4 GHz radio anyway
    freq_list=2412 2417 2422 2427 2432 2437 2442 2447 2452 2457 2462
}
