# /etc/dhcpcd.conf — Voron 0.2 (static IP)
# This is the EXISTING home config — no changes needed for booth.
# Static IP 192.168.0.128, gateway 192.168.0.1 works on both home and booth network.

interface wlan0
static ip_address=192.168.0.128/24
static routers=192.168.0.1
static domain_name_servers=1.1.1.1 8.8.8.8
