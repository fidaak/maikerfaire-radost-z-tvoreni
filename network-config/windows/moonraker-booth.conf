# moonraker.conf additions for booth LAN
# Merge into ~/printer_data/config/moonraker.conf on EACH printer.
# After editing: sudo systemctl restart moonraker

[authorization]
# Only booth LAN (192.168.0.x) can access without credentials
trusted_clients:
    127.0.0.1
    192.168.0.0/24

[update_manager]
# Disable automatic GitHub version polling — booth may run offline.
# Without this, update checks timeout and pollute logs.
enable_auto_refresh: False
